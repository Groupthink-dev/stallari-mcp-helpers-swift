name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Swift test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15]
        # macos-14 dropped: ships Swift 5.10 by default; Package.swift requires
        # swift-tools-version 6.0+. Re-enable with `maxim-lobanov/setup-xcode@v1
        # xcode-version: '16.0'` if Swift 5.10 backport is ever in scope.

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Test
        run: swift test --enable-code-coverage

      - name: Coverage report
        if: matrix.os == 'macos-15'
        run: |
          xcrun llvm-cov report \
            .build/debug/stallari-mcp-helpersPackageTests.xctest/Contents/MacOS/stallari-mcp-helpersPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -ignore-filename-regex='\.build|Tests' \
            || echo "(coverage report best-effort)"

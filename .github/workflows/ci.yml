name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Swift test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Test
        run: swift test --enable-code-coverage

      - name: Coverage report
        if: matrix.os == 'macos-15'
        run: |
          xcrun llvm-cov report \
            .build/debug/stallari-mcp-helpersPackageTests.xctest/Contents/MacOS/stallari-mcp-helpersPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -ignore-filename-regex='\.build|Tests' \
            || echo "(coverage report best-effort)"
